name: validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Validation scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Select checks
        id: scope
        run: |
          node --test .github/scripts/test/validation-scope.test.mjs
          node .github/scripts/validation-scope.mjs >> "$GITHUB_OUTPUT"
          git diff --check HEAD^ HEAD

  test:
    name: Rust and Dashboard Tests
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
      - name: Build and check dashboard
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run format:check
          npm --prefix frontend test
          npm --prefix frontend run build
      - name: Check Rust and repository automation
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          node --test .github/scripts/test/*.test.mjs
          node .github/scripts/release.mjs read
          node .github/scripts/release.mjs artifacts "$(node .github/scripts/release.mjs read)"
          git diff --exit-code
      - name: Build the browser fixture once
        run: |
          cargo build --locked --features dashboard-fixture --bin dashboard-fixture
          strip target/debug/dashboard-fixture
          tar -czf "$RUNNER_TEMP/dashboard-fixture.tar.gz" -C target/debug dashboard-fixture -C "$GITHUB_WORKSPACE" web
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-fixture
          path: ${{ runner.temp }}/dashboard-fixture.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  browser:
    name: Browser and Accessibility (${{ matrix.shard }}/2)
    needs: [scope, test]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-fixture
          path: ${{ runner.temp }}
      - name: Prepare the browser fixture
        run: |
          tar -xzf "$RUNNER_TEMP/dashboard-fixture.tar.gz"
          npm --prefix frontend ci
      - name: Browser and accessibility tests
        working-directory: frontend
        env:
          PLAYWRIGHT_PREBUILT_FIXTURE: '1'
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test:browser -- --fully-parallel --shard=${{ matrix.shard }}/2
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7

  docker:
    name: Docker Build (${{ matrix.arch }})
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - name: Prepare image tools and version
        id: image
        run: |
          command -v skopeo || { sudo apt-get update; sudo apt-get install -y --no-install-recommends skopeo; }
          echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: twitch-drops-miner:test
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: false
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=miner-${{ matrix.arch }}
          cache-to: type=gha,scope=miner-${{ matrix.arch }},mode=max
      - name: Load the exported image for testing
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          skopeo --override-arch "$ARCH" copy "oci-archive:$RUNNER_TEMP/image.tar" docker-daemon:twitch-drops-miner:test
          config=$(skopeo inspect --raw "oci-archive:$RUNNER_TEMP/image.tar" | jq -r .config.digest)
          test "$(docker image inspect --format '{{.Id}}' twitch-drops-miner:test)" = "$config"
      - name: Check runtime, ownership and health without network access
        env:
          PLATFORM: linux/${{ matrix.arch }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          test "$(docker run --rm --platform "$PLATFORM" --network none twitch-drops-miner:test --version)" = "twitch-drops-miner $VERSION"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' twitch-drops-miner:test)" = "PolyForm-Noncommercial-1.0.0"
          docker run --rm --platform "$PLATFORM" --network none --entrypoint sh twitch-drops-miner:test -ec '
            test "$(id -u):$(id -g)" = "1000:1000"
            test -r /usr/share/licenses/twitch-drops-miner/LICENSE.md
            test -r /usr/share/licenses/twitch-drops-miner/NOTICE.md
            grep -Fxq "Required Notice: Copyright (c) 2026 ohne-b (OhneB)" /usr/share/licenses/twitch-drops-miner/LICENSE.md
            grep -Fxq "# PolyForm Noncommercial License 1.0.0" /usr/share/licenses/twitch-drops-miner/LICENSE.md
            grep -Fq "Copyright (c) 2024 DevilXD" /usr/share/licenses/twitch-drops-miner/NOTICE.md
            test -r /usr/share/licenses/twitch-drops-miner/dashboard/manrope.txt
            test ! -e /app/src
            ! command -v python
            ! command -v node
          '
          container=$(docker run -d --platform "$PLATFORM" --network none --read-only \
            --tmpfs /app/data:uid=1000,gid=1000 --tmpfs /app/logs:uid=1000,gid=1000 twitch-drops-miner:test)
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 20); do
            if docker exec "$container" /usr/local/bin/twitch-drops-miner healthcheck; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Retain the tested image for publishing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  complete:
    name: Validation
    if: always()
    needs: [scope, test, browser, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$FULL" = false ]; then
            test "$TEST_RESULT" = skipped
            test "$BROWSER_RESULT" = skipped
            test "$DOCKER_RESULT" = skipped
            echo 'Documentation-only PR: code and image checks are not needed.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FULL" = true ]; then
            test "$TEST_RESULT" = success
            test "$BROWSER_RESULT" = success
            test "$DOCKER_RESULT" = success
          else
            exit 1
          fi
